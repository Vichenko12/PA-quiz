<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68738a;--primary:#5b5ce2;--primary2:#7778f0;--good:#16a36a;--bad:#e05252;--line:#e6e9f1;--shadow:0 18px 50px rgba(25,35,70,.10)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#eef0ff 0,transparent 32%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
.app{max-width:1050px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:24px}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.pill{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:12px;color:var(--muted);box-shadow:0 5px 18px rgba(25,35,70,.05)}
.progressWrap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin-bottom:18px;box-shadow:var(--shadow)}.progressMeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:9px}.bar{height:9px;background:#edf0f7;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px;transition:width .55s cubic-bezier(.22,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}.stat b{font-size:19px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px;position:relative;overflow:hidden;animation:cardIn .42s ease both}@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.section{display:inline-flex;background:#eef0ff;color:#4e50c7;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;letter-spacing:.03em;margin-bottom:15px}.qnum{color:var(--muted);font-size:13px;margin-bottom:8px}.question{font-size:21px;line-height:1.42;margin:0 0 20px;font-weight:750}
.options{display:grid;gap:11px}.option{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:15px 16px;display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--text);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}.option:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(25,35,70,.08);border-color:#bfc3f5}.letter{min-width:29px;height:29px;border-radius:9px;background:#f0f2f8;display:grid;place-items:center;font-weight:800;font-size:12px;color:#58627a}.option.correct{border-color:#74d2ab;background:#effbf6}.option.correct .letter{background:#ccefe0;color:#087b4d}.option.wrong{border-color:#ef9a9a;background:#fff4f4}.option.wrong .letter{background:#ffdcdc;color:#a83232}
.feedback{margin-top:18px;border-radius:16px;padding:16px;display:none;animation:pop .35s cubic-bezier(.2,.9,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.97) translateY(5px)}to{opacity:1;transform:none}}.feedback.show{display:block}.feedback.good{background:#effbf6;border:1px solid #bce9d6}.feedback.bad{background:#fff4f4;border:1px solid #f1c0c0}.feedbackTitle{font-weight:850;margin-bottom:7px}.feedback p{margin:0;color:#42506a;font-size:14px;line-height:1.55}.nextRow{display:flex;justify-content:flex-end;margin-top:18px}.next{display:none;border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:12px 20px;border-radius:13px;font-weight:800;cursor:pointer;box-shadow:0 9px 22px rgba(91,92,226,.25);transition:transform .18s}.next.show{display:block}.next:hover{transform:translateY(-2px)}.next:active{transform:translateY(0)}
.toast{position:fixed;top:22px;left:50%;transform:translate(-50%,-120px);background:#fff;border:1px solid var(--line);box-shadow:0 15px 40px rgba(20,25,60,.18);padding:12px 17px;border-radius:14px;font-weight:800;z-index:10;transition:transform .35s cubic-bezier(.2,.9,.2,1)}.toast.show{transform:translate(-50%,0)}.toast.good{color:#087b4d}.toast.bad{color:#a83232}
.finish{display:none;text-align:center;padding:42px 25px}.finish.show{display:block;animation:cardIn .45s ease}.finishIcon{font-size:58px;animation:bounce 1.1s ease infinite alternate}@keyframes bounce{to{transform:translateY(-8px) rotate(3deg)}}.finish h2{font-size:30px;margin:12px 0 6px}.score{font-size:42px;font-weight:900;color:var(--primary);margin:12px}.review{margin-top:22px;text-align:left;display:grid;gap:10px}.reviewItem{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafbfe}.reviewItem b{display:block;margin-bottom:5px}.reviewItem small{color:var(--muted)}.restart{border:0;background:#20243a;color:white;border-radius:13px;padding:12px 20px;font-weight:800;cursor:pointer;margin-top:18px}
@media(max-width:700px){.app{padding:18px 12px}.card{padding:20px;border-radius:20px}.question{font-size:18px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:17px}}

<script>
const questions = [{"n": 1, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "What is the primary objective of Legal Appraisal in project evaluation?", "opts": ["To design the promotional and advertising strategy for the product.", "To forecast consumer demand and estimate market share.", "To calculate the internal rate of return (IRR) and net present value (NPV).", "To verify the project's legal feasibility, regulatory compliance, and institutional authority."], "a": 3, "exp": "Thẩm định pháp lý (Legal Appraisal) có mục tiêu cốt lõi là kiểm tra tính khả thi về mặt pháp lý, sự tuân thủ các quy định pháp luật hiện hành và thẩm quyền pháp lý của các bên liên quan."}, {"n": 2, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Which of the following is NOT one of the three core components of Legal Due Diligence outlined in Chapter 5?", "opts": ["Assessment of the legal readiness of the procuring authority.", "Analysis of the applicable legal framework.", "In-depth legal analysis of the main project issues.", "Technical engineering specification appraisal."], "a": 3, "exp": "Legal due diligence gồm 3 phần chính: (1) Khung pháp lý áp dụng, (2) Sự sẵn sàng/thẩm quyền pháp lý của cơ quan mua sắm/chủ đầu tư, (3) Phân tích sâu các vấn đề pháp lý dự án. Thẩm định kỹ thuật thuộc phần kỹ thuật, không phải legal due diligence."}, {"n": 3, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "When analyzing the applicable legal framework, which body of law is checked for general contractual and procurement guidelines?", "opts": ["Public procurement law.", "Foreign exchange and currency control legislation.", "Sector-specific corrections and security legislation.", "Environmental protection and land use planning law."], "a": 0, "exp": "Luật đấu thầu/mua sắm công (Public procurement law) cung cấp các hướng dẫn chung về hợp đồng và quy trình lựa chọn nhà đầu tư."}, {"n": 4, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Why is assessing the 'legal readiness' of the procuring or promoting authority critical before project launch?", "opts": ["To confirm that the involved institutions have the formal legal authority to approve, launch, and execute the project.", "To ensure the procuring authority has sufficient private equity capital.", "To guarantee a fixed return on investment for all private sponsors.", "To eliminate all market competition and secure a monopoly."], "a": 0, "exp": "Rà soát sự sẵn sàng pháp lý giúp xác nhận cơ quan nhà nước/chủ đầu tư có đầy đủ thẩm quyền pháp lý (legal authority/empowerment) để phê duyệt và triển khai dự án."}, {"n": 5, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "In legal due diligence, checking step-in rights for lenders falls under which category of project issues?", "opts": ["Environmental impact and site clearance.", "Commercial feasibility and bankability.", "Taxation and accountancy regime.", "Labor and employment relations."], "a": 1, "exp": "Quyền can thiệp (Step-in rights) cho bên cho vay thuộc về tính khả thi thương mại và khả năng vay vốn (bankability) của dự án."}, {"n": 6, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Under the analysis of land and property asset issues, what specific right is essential for linear/transportation projects?", "opts": ["Right-of-way / site clearance rights.", "Dividend repatriation controls.", "Tax exemption certificates.", "Corporate branding rights."], "a": 0, "exp": "Đối với các dự án giao thông/đường dây tuyến tính, quyền sử dụng đất và quyền đi qua (Right of way) là điều kiện quan trọng để dự án có thể triển khai theo tuyến."}, {"n": 7, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Foreign Direct Investment (FDI) legal appraisal must carefully examine restrictions regarding:", "opts": ["Currency exchange controls and dividend repatriation limitations.", "The exact daily operating hours of the facility.", "The selection of internal accounting software.", "Maximum advertising expenditure limits."], "a": 0, "exp": "Thẩm định pháp lý FDI phải đánh giá các hạn chế về chính sách tiền tệ và quy định chuyển lợi nhuận về nước."}, {"n": 8, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Which primary legal factor caused the collapse of the Cocobay Da Nang condotel project in 2019?", "opts": ["The prohibition of all foreign tourists from entering Da Nang.", "A sudden drop in global coffee consumption prices.", "Required registration by international trademark enforcement agencies.", "The lack of a clear legal framework for condotel ownership rights and land-use titles."], "a": 3, "exp": "Nguyên nhân cốt lõi là thiếu khung pháp lý rõ ràng về quyền sở hữu condotel và quyền sử dụng đất. Giá cả/phân khúc thị trường không phải nguyên nhân pháp lý chính dẫn tới vụ việc."}, {"n": 9, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "In the Cocobay Da Nang case study, what commitment did the developer (Empire Group) fail to fulfill in 2019?", "opts": ["The repayment of foreign government ODA loans.", "The provision of free lifelong airline tickets to all buyers.", "The construction of the national highway connecting Da Nang to Hanoi.", "The promised high guaranteed annual returns to condotel investors."], "a": 3, "exp": "Năm 2019, Empire Group tuyên bố vỡ cam kết trả lợi nhuận cam kết cao (guaranteed returns) cho các chủ đầu tư căn hộ."}, {"n": 10, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Condotels are best defined as hybrid real estate properties that combine:", "opts": ["Industrial factories and agricultural farms.", "Condominiums and hotel services.", "Commercial banks and retail shopping malls.", "Public schools and government offices."], "a": 1, "exp": "Condotel là mô hình bất động sản kết hợp giữa căn hộ chung cư (Condo) và dịch vụ khách sạn (Hotel)."}, {"n": 11, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Legal due diligence regarding environmental issues requires verifying whether:", "opts": ["The project produces zero carbon emissions permanently.", "Specific environmental clearances (e.g., Environmental Impact Assessment - EIA) are legally mandatory.", "All environmental protection laws are completely waived for foreign investors.", "Environmental inspection fees can be credited as corporate dividends."], "a": 1, "exp": "Các dự án phải xác minh xem dự án có bắt buộc phải có các giấy phép/chấp thuận môi trường, ví dụ Báo cáo đánh giá tác động môi trường (EIA), hay không."}, {"n": 12, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "Which legal issue must be evaluated when a project involves taking security over project bank accounts and future income streams?", "opts": ["Public sector labor union strike regulations.", "National intellectual property rights registration.", "Commercial bankability and financial security enforceability.", "Consumer protection law regarding retail return policies."], "a": 2, "exp": "Việc thế chấp tài khoản ngân hàng và dòng tiền tương lai liên quan trực tiếp đến khả năng thực thi quyền bảo đảm và khả năng tài chính (bankability)."}, {"n": 13, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "In legal due diligence, potential 'alternative ownership claims' on land refers to:", "opts": ["Unpaid tax obligations from previous commercial operating years.", "Claims by foreigners for higher stock dividend yields.", "Competing corporate branding and trademark infringements.", "Disputes or undocumented traditional property ownership rights over the project site."], "a": 3, "exp": "Tranh chấp quyền sở hữu đất trùng lặp hoặc đất chưa có giấy chứng nhận rõ ràng là rủi ro pháp lý về quyền sở hữu đất đai."}, {"n": 14, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "What must legal due diligence review sector-specific legislation (e.g., healthcare, tourism, or prisons)?", "opts": ["To calculate the depreciation rate of office furniture.", "To replace the national tax authority with private audit firms.", "To set the maximum retail price for all consumer goods nationwide.", "To confirm whether private sector entities are legally permitted to operate and deliver services in that specific sector."], "a": 3, "exp": "Mỗi ngành kinh doanh có những quy định riêng; rà soát luật chuyên ngành giúp xác định liệu chủ thể tư nhân có được phép hoạt động và cung cấp dịch vụ trong ngành đó hay không."}, {"n": 15, "section": "LEGAL APPRAISAL & LEGAL DUE DILIGENCE", "q": "What is the ultimate goal of completing thorough legal appraisal before committing capital to a project?", "opts": ["To automatically receive 100% tax exemption from the government.", "To eliminate the need for financial and technical feasibility studies.", "To guarantee that the project will never face market competition.", "To mitigate regulatory risks, ensure contract enforceability, and prevent costly legal disputes."], "a": 3, "exp": "Thẩm định pháp lý đầy đủ giúp giảm thiểu rủi ro pháp lý, bảo đảm tính thi hành của hợp đồng và tránh các tranh chấp kéo dài, tốn kém."}, {"n": 16, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "What are the two foundational dimensions evaluated in Market Appraisal?", "opts": ["Gross domestic product (GDP) and national inflation rate.", "Taxation rates and import/export schedules.", "Total potential market size and expected project market share.", "Engineering layout design and machinery maintenance schedules."], "a": 2, "exp": "Thẩm định thị trường tập trung đánh giá 2 khía cạnh chính: Quy mô thị trường tiềm năng và thị phần dự kiến của dự án."}, {"n": 17, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "What are the primary base documents required for conducting a Market Appraisal?", "opts": ["Environmental assessment certificates and fire safety approvals.", "Building construction permits and lease contracts.", "Market investigation data, price fluctuation forecasts, competitor analysis, and product capability reports.", "Audited financial balance sheets from the past 10 years."], "a": 2, "exp": "Thẩm định thị trường cần dữ liệu thị trường, dự báo biến động giá, thông tin đối thủ cạnh tranh và báo cáo năng lực sản phẩm."}, {"n": 18, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "In the Starbucks Vietnam case study, what major market factor challenged Starbucks' rapid expansion?", "opts": ["Strong local coffee culture, intense domestic competition, and distinct consumer taste preferences.", "Extremely low local production of raw coffee beans in Vietnam.", "A total government ban on foreign coffee chains operating in Vietnam.", "The complete absence of coffee consumers in urban Vietnamese cities."], "a": 0, "exp": "Starbucks gặp thách thức từ văn hóa cà phê mạnh tại Việt Nam, cạnh tranh gay gắt từ các chuỗi nội địa và khẩu vị người tiêu dùng khác biệt."}, {"n": 19, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Compared to neighboring Southeast Asian countries (e.g., Malaysia, Thailand), Starbucks' store density per capita in Vietnam is:", "opts": ["Significantly lower (e.g., 1 store per 1.67 million people).", "The highest in the world with over 1 store per 1,000 people.", "Exactly equal to its store density in Seattle, USA.", "Zero, because Starbucks closed all its stores permanently in 2020."], "a": 0, "exp": "Mật độ cửa hàng Starbucks trên đầu người ở Việt Nam thấp hơn nhiều so với các nước láng giềng; ví dụ khoảng 1 cửa hàng trên 1,67 triệu người."}, {"n": 20, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "According to market research data in the Starbucks case study, which domestic chain led the Vietnamese coffee market in revenue?", "opts": ["Dunkin' Donuts.", "Highlands Coffee.", "Gloria Jean's Coffees.", "The Coffee Bean & Tea Leaf."], "a": 1, "exp": "Dữ liệu thị trường trong slide cho thấy Highlands Coffee dẫn đầu doanh thu trong các chuỗi cà phê tại Việt Nam."}, {"n": 21, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Market appraisal aims to answer which critical question regarding the project's output?", "opts": ["What is the exact engineering tensile strength of the factory roof?", "How many legal patents does the contractor hold globally?", "Will the government nationalize the project after years of operation?", "Is there sufficient effective demand at a price that ensures commercial profitability?"], "a": 3, "exp": "Thẩm định thị trường trả lời câu hỏi: Có đủ cầu hiệu quả (Effective demand) tại mức giá chấp nhận được để bảo đảm hiệu quả thương mại hay không?"}, {"n": 22, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "When analyzing 'Competitors and Substitute Products' in market appraisal, analysts must evaluate:", "opts": ["The historical weather patterns of the competitor's headquarters.", "The average depreciation of foreign supplier nations.", "The personal educational history of the competitor's chief accountant.", "Current market supply, competitor pricing strategies, and potential substitute offerings."], "a": 3, "exp": "Phân tích đối thủ và sản phẩm thay thế cần xem xét nguồn cung hiện tại, chiến lược giá của đối thủ và các sản phẩm có khả năng thay thế."}, {"n": 23, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "A product capability and prospect report in market appraisal is used to evaluate:", "opts": ["The annual legal wage rate for unskilled construction workers.", "How quickly the factory building will depreciate for tax accounting purposes.", "Whether the project's product specifications align with target market requirements and future trends.", "The total interest payable on long-term government bonds."], "a": 2, "exp": "Báo cáo triển vọng sản phẩm đánh giá tính phù hợp của đặc tính sản phẩm so với nhu cầu và xu hướng tương lai của thị trường."}, {"n": 24, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Commercial viability of a new consumer product depends primarily on:", "opts": ["Relying exclusively on word-of-mouth advertising budget.", "Selling products at a price that is above cost indefinitely.", "Establishing a competitive advantage in product quality, pricing, distribution, or promotion.", "Securing a government subsidy for 100% of production costs."], "a": 2, "exp": "Việc đạt được hiệu quả thương mại phụ thuộc vào việc tạo lợi thế cạnh tranh về chất lượng, giá cả, phân phối hoặc xúc tiến bán hàng."}, {"n": 25, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Which type of market data provides information on historical price fluctuations and industry growth trends?", "opts": ["Employee safety training manuals.", "Architectural engineering blueprints.", "Corporate articles of association.", "Market forecasting and statistical historical data."], "a": 3, "exp": "Dữ liệu lịch sử và dữ liệu dự báo cung cấp thông tin về biến động giá trong quá khứ và xu hướng tăng trưởng của ngành."}, {"n": 26, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "In market appraisal, evaluating 'effective demand' means measuring:", "opts": ["A unified wish list on social media platforms without purchasing intent.", "The total volume of products manufactured but still in warehouses.", "The total population of the country regardless of income.", "Consumer willingness AND financial ability to buy the product at a given price."], "a": 3, "exp": "Cầu hiệu quả (Effective demand) bao gồm cả mong muốn mua và khả năng thanh toán của người tiêu dùng ở mức giá cụ thể."}, {"n": 27, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Market certainty in project appraisal is reduced when:", "opts": ["Consumer demand is completely inelastic and highly predictable.", "There are rapid technological changes and aggressive entry of new competitors.", "Raw material supply contracts are locked at fixed prices for 20 years.", "The product has a legally protected monopoly with fixed long-term contracts."], "a": 1, "exp": "Mức độ chắc chắn của thị trường giảm mạnh khi công nghệ thay đổi nhanh và có sự gia nhập mạnh của các đối thủ mới."}, {"n": 28, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Understanding consumer taste preferences in local market appraisal helps prevent:", "opts": ["Legal disputes regarding zoning permissions.", "Increases in corporate income taxes.", "Technical machinery breakdowns during manufacturing.", "Product failure due to misalignment between global product offerings and local habits."], "a": 3, "exp": "Hiểu người tiêu dùng địa phương giúp tránh thất bại do áp đặt sản phẩm toàn cầu không phù hợp với thói quen, khẩu vị và nhu cầu bản địa."}, {"n": 29, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "What is a substitute product in market analysis?", "opts": ["A different product that satisfies the same basic consumer need.", "A raw material used exclusively in the production process.", "A legal document verifying product safety standards.", "An identical product made by the exact same manufacturer."], "a": 0, "exp": "Sản phẩm thay thế là sản phẩm khác nhưng đáp ứng cùng một nhu cầu cơ bản của khách hàng."}, {"n": 30, "section": "MARKET APPRAISAL & COMPETITIVE DYNAMICS", "q": "Why must market appraisal examine both current demand and future projected demand?", "opts": ["To ensure present factory machinery is immediately sold.", "Because investment projects take time to build, and capacity must meet future demand upon completion.", "To fulfill a formal legal requirement with no practical impact.", "To calculate historical tax liabilities for past operational years."], "a": 1, "exp": "Dự án đầu tư mất thời gian để xây dựng; thẩm định phải dự báo cầu tương lai để bảo đảm khi dự án đi vào hoạt động thì công suất đáp ứng được nhu cầu."}, {"n": 31, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "What are the four original components of the traditional 4Ps Marketing Mix?", "opts": ["Product, Price, Place, and Promotion.", "Planning, Production, Packaging, and Positioning.", "People, Process, Physical evidence, and Profit.", "Policy, Procurement, Public relations, and Performance."], "a": 0, "exp": "Mô hình 4P truyền thống gồm 4 yếu tố: Product (Sản phẩm), Price (Giá), Place (Phân phối), và Promotion (Xúc tiến bán hàng)."}, {"n": 32, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "In the 4P framework, which key question belongs under the 'Product' strategy?", "opts": ["What is the corporate tax rate applicable to exporters?", "What rent terms will commercial tenants negotiate?", "What is the exact shipping cost kilometer for all distributors?", "What specific problem does your product solve for the target customer?"], "a": 3, "exp": "Product trả lời câu hỏi về vấn đề cụ thể mà sản phẩm giải quyết cho khách hàng mục tiêu."}, {"n": 33, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "The 'Price' component of the 4Ps marketing mix focuses on determining:", "opts": ["The physical dimensions and weight of the product packaging.", "The demographic background of retail sales associates.", "The geographical location of retail flagship stores.", "Customer willingness to spend, competitor pricing, and cost to create."], "a": 3, "exp": "Price xem xét mức giá mà khách hàng sẵn sàng trả, giá của đối thủ và chi phí tạo ra sản phẩm."}, {"n": 34, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "In the 4P framework, 'Place' refers primarily to:", "opts": ["The distribution channels and locations where target customers purchase the product.", "The company income tax rate.", "The geographical site selected for building the manufacturing plant.", "The physical ranking of the company within the stock exchange."], "a": 0, "exp": "Place đề cập đến các kênh phân phối và địa điểm nơi khách hàng mục tiêu mua sản phẩm."}, {"n": 35, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "Which of the following activities is part of the 'Promotion' element in the 4Ps?", "opts": ["Executing land lease agreements with local authorities.", "Negotiating raw material supply contracts with overseas vendors.", "Determining the depreciation schedule for equipment.", "Selecting media distribution channels and designing advertising messages."], "a": 3, "exp": "Promotion (Xúc tiến) bao gồm chọn kênh truyền thông, quảng cáo, khuyến mãi và định hình thông điệp hướng tới khách hàng."}, {"n": 36, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "The 7Ps Marketing Mix extends the traditional 4Ps by adding which three elements?", "opts": ["Procurement, Packaging, and Positioning.", "Planning, Performance, and Protection.", "Partners, Profitability, and Publicity.", "People, Physical evidence, and Process."], "a": 3, "exp": "Mô hình 7P mở rộng 4P bằng cách bổ sung 3 yếu tố: People (Con người), Physical evidence (Bằng chứng hữu hình), và Process (Quy trình)."}, {"n": 37, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "In the 7Ps framework, 'People' represents:", "opts": ["External shareholders who hold non-voting preference shares.", "Government inspectors who perform annual tax audits.", "The company's internal staff, team members, and service providers who interact with customers.", "The total population of the country where the project is located."], "a": 2, "exp": "People trong 7P thể hiện đội ngũ nhân sự nội bộ, nhân viên giao dịch/dịch vụ trực tiếp tương tác với khách hàng."}, {"n": 38, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "What does 'Physical evidence' refer to in the 7Ps marketing mix?", "opts": ["The physical weight of heavy machinery in the manufacturing building.", "Tangible proof and environmental validating that the brand's marketing claims are true.", "The legal land ownership certificate issued by government.", "The paper receipts filed for annual tax reconciliation."], "a": 1, "exp": "Physical evidence là bằng chứng hữu hình (physical evidence) và bằng chứng của môi trường cho thấy các tuyên bố marketing của thương hiệu là đúng."}, {"n": 39, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "In the 7Ps framework, 'Process' pertains to:", "opts": ["The operational procedures, transportation, and delivery mechanisms of the product/service.", "The metallurgical process for smelting raw iron ore.", "The administrative process of obtaining a building permit.", "The legal court process for resolving shareholder disputes."], "a": 0, "exp": "Process trong 7P liên quan đến quy trình vận hành, vận chuyển và giao nhận của sản phẩm/dịch vụ tới người dùng."}, {"n": 40, "section": "MARKETING MIX – 4Ps & 7Ps", "q": "The 7Ps framework is particularly essential for appraising projects in which sector?", "opts": ["Unprocessed agricultural grain export.", "Heavy crude oil extraction.", "Bulk raw mineral mining.", "Service industries (e.g., hospitality, banking, healthcare, education)."], "a": 3, "exp": "Mô hình 7P đặc biệt phù hợp với các ngành dịch vụ như khách sạn, du lịch, ngân hàng, y tế và giáo dục, vì các yếu tố con người, quy trình và bằng chứng hữu hình rất quan trọng."}, {"n": 41, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "What is the key distinction between Primary Data and Secondary Data in market research?", "opts": ["Primary data is free of charge, while secondary data requires government approval.", "Primary data is collected firsthand for the specific study, while secondary data was previously gathered by others.", "Primary data is always numerical, while secondary data is always text.", "Primary data comes from foreign sources, while secondary data comes from local sources."], "a": 1, "exp": "Dữ liệu sơ cấp (Primary data) được thu thập trực tiếp cho mục đích nghiên cứu cụ thể; dữ liệu thứ cấp (Secondary data) là dữ liệu đã được thu thập trước đó bởi người khác."}, {"n": 42, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "Which of the following is a recognized official source of secondary market data in Vietnam?", "opts": ["The Statistical Yearbook (Niên giám thống kê) and Ministry of Finance economic reports.", "A verified personal blog post on social media.", "Internal confidential emails of competitor companies.", "Anonymous public forum comments."], "a": 0, "exp": "Nguồn dữ liệu thứ cấp chính thức có thể gồm Niên giám thống kê và các báo cáo kinh tế của Bộ Tài chính."}, {"n": 43, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "In market survey sampling, what is a 'Census' compared to a 'Sample Survey'?", "opts": ["A Census is illegal for private companies, while a Sample Survey is mandatory.", "A Census is conducted online, while a Sample Survey is conducted door-to-door.", "A Census investigates every single unit in the target population, whereas a Sample Survey studies a selected subset.", "A Census measures only prices, while a Sample Survey measures only quality."], "a": 2, "exp": "Census điều tra toàn bộ (100%) các đơn vị trong tổng thể; Sample Survey chỉ chọn một nhóm (mẫu) để điều tra."}, {"n": 44, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "Which qualitative demand forecasting technique relies on structured, iterative feedback from a panel of independent experts?", "opts": ["Input-Output Matrix Modeling.", "The Delphi Method.", "Linear Regression Analysis.", "Simple Moving Average Smoothing."], "a": 1, "exp": "Phương pháp Delphi là kỹ thuật dự báo định tính dựa trên ý kiến đánh giá nhiều vòng của một nhóm chuyên gia."}, {"n": 45, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "Time-series demand forecasting methods rely primarily on which underlying assumption?", "opts": ["Historical demand patterns and seasonal trends will continue into the future.", "Consumer income will double every single calendar year.", "Competitors will immediately enter the market upon project launch.", "Government regulations will permanently freeze product prices."], "a": 0, "exp": "Dự báo chuỗi thời gian (Time-series) giả định rằng các quy luật và xu hướng của nhu cầu trong quá khứ sẽ tiếp tục trong tương lai."}, {"n": 46, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "A linear regression analysis in quantitative demand forecasting is classified as a:", "opts": ["Qualitative expert judgment technique.", "Random Monte Carlo simulation.", "Subjective guessing framework.", "Causal (cause-and-effect) forecasting method."], "a": 3, "exp": "Hồi quy tuyến tính (Regression) là một phương pháp dự báo nhân quả (causal), thể hiện mối quan hệ giữa các biến để dự báo nhu cầu."}, {"n": 47, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "The 7 qualitative aspects used to characterize a market include evaluating:", "opts": ["Extraordinary weather patterns, spare parts inventory levels, fuel consumption, and waste output.", "Effective demand, market breakdown/segmentation, pricing, distribution, consumers, competitors, and government policy.", "Corporate tax rates, import tariffs, bank interest rates, inflation, exchange rates, GDP growth, and national debt.", "Building architecture, soil density, rainfall, humidity, wind speed, solar exposure, and elevation."], "a": 1, "exp": "7 khía cạnh chính của thị trường gồm: Cầu hiệu quả, phân chia/đoạn thị trường, giá, phân phối, người tiêu dùng, đối thủ cạnh tranh và chính sách nhà nước."}, {"n": 48, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "Which source of error or uncertainty frequently distorts long-term market demand forecasting?", "opts": ["Conducting survey interviews during regular business hours.", "Printing market questionnaires on recycled paper.", "Using standard metronutics for product weight measurement.", "Unforeseen macroeconomic shocks, sudden policy shifts, and unexpected technology disruptions."], "a": 3, "exp": "Sai số dự báo thường phát sinh từ các cú sốc vĩ mô ngoài dự kiến, thay đổi chính sách đột ngột hoặc sự xuất hiện của công nghệ phá vỡ (disruptive technology)."}, {"n": 49, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "The 'End-Use Method' for demand forecasting determines product demand by analyzing:", "opts": ["The expected consumption rates across all final consuming sectors and industries.", "The historical stock market price of global computer equities.", "The personal preferences of the company's founding board members.", "The final resale price of spare materials after 20 years of factory operation."], "a": 0, "exp": "Phương pháp đầu cuối (End-Use Method) dự báo cầu bằng cách phân tích mức tiêu dùng dự kiến của các ngành và lĩnh vực sử dụng sản phẩm cuối cùng."}, {"n": 50, "section": "DATA COLLECTION & DEMAND FORECASTING METHODS", "q": "Why is pre-testing a market survey questionnaire essential before full-scale field execution?", "opts": ["To identify ambiguous questions, correct wording flaws, and measure response completion time.", "To guarantee that 100% of respondents will agree to purchase the product.", "To fulfill a mandatory requirement for filing corporate income tax.", "To eliminate the need for statistical data analysis."], "a": 0, "exp": "Thử nghiệm bảng hỏi (Pre-testing) giúp phát hiện các câu hỏi mơ hồ, lỗi diễn đạt và ước tính thời gian trả lời trước khi triển khai khảo sát quy mô lớn."}];
let i=0, answered=0, correct=0, wrong=0, locked=false, history=[];
const letters=["A","B","C","D"];
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function render(){
  const q=questions[i]; locked=false;
  document.getElementById("progressText").textContent=`Question ${i+1} of ${questions.length}`;
  const pct=Math.round(i/questions.length*100); document.getElementById("pct").textContent=pct+"%";
  document.getElementById("fill").style.width=pct+"%";
  document.getElementById("quiz").innerHTML=`<section class="card">
    <div class="section">${esc(q.section)}</div>
    <div class="qnum">Question ${q.n}</div>
    <h2 class="question">${esc(q.q)}</h2>
    <div class="options">${q.opts.map((x,k)=>`<button class="option" data-k="${k}" onclick="choose(${k})"><span class="letter">${letters[k]}</span><span>${esc(x)}</span></button>`).join("")}</div>
    <div class="feedback" id="feedback"><div class="feedbackTitle" id="feedbackTitle"></div><p>${esc(q.exp)}</p></div>
    <div class="nextRow"><button class="next" id="next" onclick="next()">Next →</button></div>
  </section>`;
}
function choose(k){
 if(locked)return; locked=true;
 const q=questions[i], opts=[...document.querySelectorAll(".option")];
 opts.forEach((b,idx)=>{b.disabled=true;if(idx===q.a)b.classList.add("correct");if(idx===k&&idx!==q.a)b.classList.add("wrong");});
 const ok=k===q.a; answered++; ok?correct++:wrong++;
 history.push({n:q.n,q:q.q,user:k,answer:q.a});
 document.getElementById("answered").textContent=answered;document.getElementById("correct").textContent=correct;document.getElementById("wrong").textContent=wrong;
 const fb=document.getElementById("feedback"), title=document.getElementById("feedbackTitle");
 fb.className="feedback show "+(ok?"good":"bad");title.textContent=ok?"✓ Correct!":"✗ Not quite — correct answer: "+letters[q.a];
 document.getElementById("next").classList.add("show");
 toast(ok?"Correct! 🎯":"Review the explanation 💡",ok?"good":"bad");
}
function toast(msg,cls){const t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+cls;setTimeout(()=>t.classList.remove("show"),1250);}
function next(){if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:"smooth"});}else finish();}
function finish(){
 document.getElementById("quiz").innerHTML="";document.querySelector(".progressWrap").style.display="none";
 document.getElementById("finish").classList.add("show");document.getElementById("finalScore").textContent=`${correct} / ${questions.length}`;
 const p=correct/questions.length;document.getElementById("finalMsg").textContent=p>=.9?"Excellent work — you have a very strong grasp of Chapter 5.":p>=.7?"Good job — review the explanations for the questions you missed.":"Keep going — use the explanations below to review the key concepts.";
 document.getElementById("fill").style.width="100%";document.getElementById("pct").textContent="100%";
 document.getElementById("review").innerHTML=history.map(x=>`<div class="reviewItem"><b>Q${x.n}. ${esc(x.q)}</b><small>Your answer: ${letters[x.user]} • Correct: ${letters[x.answer]}</small></div>`).join("");
}
function restart(){location.reload()}
render();
</script>
</body></html>
